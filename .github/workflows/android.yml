name: Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_COMPILERCHECK: content
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;30.0.15729638 cmake;3.31.6'

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: android-arm64
          max-size: 3G

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build arm64-v8a only
        run: |
          f=Source/Android/app/build.gradle.kts
          sed -i 's/listOf("arm64-v8a", "x86_64")/listOf("arm64-v8a")/' "$f"
          if grep -q 'abiFilters += listOf("arm64-v8a")' "$f"; then
            echo "ABI filter narrowed to arm64-v8a"
          else
            echo "::warning::Could not narrow the ABI filter; building all ABIs"
          fi

      - name: Build debug APK
        working-directory: Source/Android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: ccache statistics
        if: always()
        run: ccache -s || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dolphin-android-debug-arm64
          path: Source/Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
